# OneCLI gateway for NanoClaw v2 (pinned 1.42.0), side by side with v1's
# ~/.onecli instance (1.15.1) so the live v1 install is never touched.
# Seeded 2026-11-08 from v1's vault (pg_dump + app-data volume copy).
name: onecli-v2

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: onecli
      POSTGRES_PASSWORD: onecli
      POSTGRES_DB: onecli
    volumes:
      - pgdata:/var/lib/postgresql
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onecli"]
      interval: 5s
      timeout: 3s
      start_period: 15s
      retries: 10
    networks:
      - onecli

  onecli:
    image: ghcr.io/onecli/onecli:${ONECLI_VERSION:-1.42.0}
    container_name: onecli-v2
    # Agent containers' HTTP(S) goes through this proxy, including MCP calls to
    # host services (gcal-mcp on host.docker.internal:3020), so the gateway
    # itself must resolve host.docker.internal.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "172.17.0.1:10264:10254"
      - "172.17.0.1:10265:10265"
    environment:
      DATABASE_URL: postgresql://onecli:onecli@postgres:5432/onecli
      # Own proxy port inside the container too: gateway-url is advertised as
      # localhost:<GATEWAY_PORT>, which agent containers reach via the host, so it
      # must not collide with v1's gateway on 10255.
      GATEWAY_PORT: "10265"
      GATEWAY_API_URL: http://localhost:10265
      GATEWAY_BASE_URL: host.docker.internal:10265
      NEXT_PUBLIC_APP_URL: http://172.17.0.1:10264
      APP_URL: http://172.17.0.1:10264
    volumes:
      - app-data:/app/data
    networks:
      - onecli

volumes:
  pgdata:
  app-data:

networks:
  onecli:
    driver: bridge
